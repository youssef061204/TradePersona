services:
  - type: web
    name: tradepersona-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_GEMINI
        value: "false"
      - key: ENABLE_AGGREGATE_ANALYTICS
        value: "false"
